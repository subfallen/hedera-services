name: Local Instant Swap fixtures

on:
  pull_request:
    paths:
      - "local-instant-swap/**"
      - "LocalInstantSwap*.bin"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/local-instant-swap-fixtures.yaml"
  push:
    branches: [plex-master]
    paths:
      - "local-instant-swap/**"
      - "LocalInstantSwap*.bin"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/local-instant-swap-fixtures.yaml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: local-instant-swap
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: local-instant-swap/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
